name: CI

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: julia-actions/setup-julia@fa02766e078afaaf09b14210362cee14137e6a32  # v3.0.2
        with:
          version: "1.12.6"
      - uses: julia-actions/cache@a7bed9df697e5d7309d68afe7542a87621a8b6c8  # v3.3.0
        with:
          delete-old-caches: "false"
      - name: Instantiate the locked environment and test
        run: |
          set -euo pipefail
          test -f Manifest.toml
          julia --startup-file=no --project=. \
            -e 'using Pkg; Pkg.instantiate(); Pkg.test(; allow_reresolve=false)' \
            2>&1 | tee week05-test.log
          git diff --exit-code -- Project.toml Manifest.toml
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        if: always()
        with:
          name: week05-test-log
          path: week05-test.log

  week05-evidence:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: julia-actions/setup-julia@fa02766e078afaaf09b14210362cee14137e6a32  # v3.0.2
        with:
          version: "1.12.6"
      - uses: julia-actions/cache@a7bed9df697e5d7309d68afe7542a87621a8b6c8  # v3.3.0
        with:
          delete-old-caches: "false"
      - name: Instantiate
        run: julia --startup-file=no --project=. -e 'using Pkg; Pkg.instantiate()'
      - name: Run Week 05 end-to-end example
        run: julia --startup-file=no --project=. examples/week05_chinese_pipeline.jl
      - name: Run Week 05 three-seed CPU comparison
        env:
          LIFEAI_WEEK05_TRAIN_STEPS: "8"
          LIFEAI_WEEK05_TOKENIZER_REPETITIONS: "10"
        run: |
          set -euo pipefail
          bash scripts/benchmark_week05.sh benchmark_results/week05-ci 2>&1 | tee week05-benchmark.log
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        if: always()
        with:
          name: week05-evidence
          path: |
            benchmark_results/week05-ci
            week05-benchmark.log

  week05-xla-smoke:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: julia-actions/setup-julia@fa02766e078afaaf09b14210362cee14137e6a32  # v3.0.2
        with:
          version: "1.12.6"
      - uses: julia-actions/cache@a7bed9df697e5d7309d68afe7542a87621a8b6c8  # v3.3.0
        with:
          delete-old-caches: "false"
      - name: Instantiate
        run: julia --startup-file=no --project=. -e 'using Pkg; Pkg.instantiate()'
      - name: Run Chapter 05 XLA CPU smoke
        run: >-
          julia --startup-file=no --project=.
          test/episodes/episode01_transformer_and_training_foundations/chapter05_tokenizer_data_pipeline/test_tokenizer_xla.jl

  week05-legacy-checkpoint:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: master
          path: legacy-master
          persist-credentials: false
      - uses: julia-actions/setup-julia@fa02766e078afaaf09b14210362cee14137e6a32  # v3.0.2
        with:
          version: "1.12.6"
      - uses: julia-actions/cache@a7bed9df697e5d7309d68afe7542a87621a8b6c8  # v3.3.0
        with:
          delete-old-caches: "false"
      - name: Generate a real master-branch v2 checkpoint
        working-directory: legacy-master
        run: |
          julia --startup-file=no --project=. -e '
            using Pkg; Pkg.instantiate()
            using LifeAI, Random
            text = repeat("abc生命", 24)
            tokenizer = fit_tokenizer(text; add_unk=true)
            model = GPTModel(vocab_size(tokenizer), 8, 2, 1; max_seq_len=4)
            trainer = TrainerGPT(learning_rate=1.0f-3)
            state = init_train_state(Xoshiro(20260720), model, trainer)
            ids = encode(tokenizer, text)
            inputs = reshape(ids[1:8], 4, 2)
            targets = reshape(ids[2:9], 4, 2)
            state, _, _ = train_step!(trainer, state, inputs, targets)
            logits, _ = model(inputs, state.parameters, state.states)
            open("../legacy-v2-logits.tsv", "w") do io
                println(io, join(Float64.(vec(logits)), Char(9)))
            end
            save_checkpoint(
                "../legacy-v2.checkpoint",
                model,
                tokenizer,
                trainer,
                state;
                progress=(; epoch=1, batch=1),
            )
          '
      - name: Load the real legacy checkpoint with Week 05 code
        run: |
          julia --startup-file=no --project=. -e '
            using Pkg; Pkg.instantiate()
            using LifeAI
            text = repeat("abc生命", 24)
            checkpoint = load_checkpoint("legacy-v2.checkpoint"; backend=:zygote)
            @assert checkpoint.source_format_version == 2
            @assert checkpoint.train_state.step == 1
            ids = encode(checkpoint.tokenizer, text)
            inputs = reshape(ids[1:8], 4, 2)
            logits, _ = checkpoint.model(
                inputs,
                checkpoint.train_state.parameters,
                checkpoint.train_state.states,
            )
            reference = parse.(
                Float64,
                split(strip(read("legacy-v2-logits.tsv", String)), Char(9)),
            )
            @assert isapprox(
                Float64.(vec(logits)),
                reference;
                atol=1.0e-6,
                rtol=1.0e-5,
            )
          '
