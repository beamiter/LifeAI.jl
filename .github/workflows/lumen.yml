name: Lumen Rust TUI

on:
  push:
    branches: [master]
    paths: ["tools/tui/**", "scripts/lifeai", ".github/workflows/lumen.yml"]
  pull_request:
    paths: ["tools/tui/**", "scripts/lifeai", ".github/workflows/lumen.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RUSTUP_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - name: Format
        run: cargo fmt --manifest-path tools/tui/Cargo.toml --check
      - name: Test
        run: cargo test --locked --manifest-path tools/tui/Cargo.toml
      - name: Clippy
        run: cargo clippy --locked --manifest-path tools/tui/Cargo.toml --all-targets -- -D warnings
